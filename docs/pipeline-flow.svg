<line x1="18" y1="128" x2="226" y2="128" stroke="#eef1f5" stroke-width="1.5"/>
<text x="18" y="157" font-size="24" font-weight="800" fill="#16a34a">26</text>
<text x="18" y="174" font-size="10.5" fill="#94a3b8">playbook files</text>
</g>
