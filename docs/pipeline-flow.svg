<text x="18" y="72" font-size="11.3" fill="#64748b">Backfill title, body, comments</text>
<text x="18" y="87.5" font-size="11.3" fill="#64748b">and reviews via GitHub GraphQL</text>
<text x="18" y="103.0" font-size="11.3" fill="#64748b">— GH Archive omits these</text>
<line x1="18" y1="128" x2="226" y2="128" stroke="#eef1f5" stroke-width="1.5"/>
<text x="18" y="157" font-size="24" font-weight="800" fill="#0d9488">14,919</text>
<text x="18" y="174" font-size="10.5" fill="#94a3b8">with real text (99.7%)</text>
</g>
<g transform="translate(586,92)">
<rect x="0" y="0" width="244" height="176" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
<rect x="0" y="0" width="244" height="6" rx="3" fill="url(#grad3)"/>
