<text x="18" y="174" font-size="10.5" fill="#94a3b8">matched / novel</text>
</g>
<g transform="translate(1142,92)">
<rect x="0" y="0" width="244" height="176" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
<rect x="0" y="0" width="244" height="6" rx="3" fill="url(#grad5)"/>
<rect x="0" y="3" width="244" height="6" fill="url(#grad5)"/>
