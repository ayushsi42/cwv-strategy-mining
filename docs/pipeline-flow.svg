        <line x1="220.2" y1="32.2" x2="224.5" y2="36.5" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<text x="58" y="45" font-size="17" font-weight="800" fill="#0f172a">Source</text>
<text x="18" y="72" font-size="11.3" fill="#64748b">Scan GH Archive for merged PRs</text>
<text x="18" y="87.5" font-size="11.3" fill="#64748b">carrying a measured or human-</text>
<text x="18" y="103.0" font-size="11.3" fill="#64748b">flagged performance signal</text>
<line x1="18" y1="128" x2="226" y2="128" stroke="#eef1f5" stroke-width="1.5"/>
<text x="18" y="157" font-size="24" font-weight="800" fill="#2563eb">14,965</text>
<text x="18" y="174" font-size="10.5" fill="#94a3b8">source records</text>
</g>
<g transform="translate(308,92)">
<rect x="0" y="0" width="244" height="176" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
<rect x="0" y="0" width="244" height="6" rx="3" fill="url(#grad2)"/>
<rect x="0" y="3" width="244" height="6" fill="url(#grad2)"/>
<circle cx="30" cy="40" r="17" fill="url(#grad2)" filter="url(#badgeShadow)"/>
<text x="30" y="45.5" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<rect x="212" y="23" width="12" height="14" rx="2" fill="none" stroke="#0d9488" stroke-width="2"/>
        <line x1="218" y1="27.5" x2="218" y2="32.5" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
