<rect x="0" y="0" width="244" height="176" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
<rect x="0" y="0" width="244" height="6" rx="3" fill="url(#grad6)"/>
<rect x="0" y="3" width="244" height="6" fill="url(#grad6)"/>
<circle cx="30" cy="40" r="17" fill="url(#grad6)" filter="url(#badgeShadow)"/>
