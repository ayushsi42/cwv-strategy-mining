<rect x="0" y="0" width="1694" height="344" fill="url(#bgGrad)"/>
<text x="30" y="34" font-size="21" font-weight="800" fill="#0f172a" letter-spacing="-0.3">cwv-playbook-miner pipeline</text>
<text x="30" y="58" font-size="13" fill="#64748b">5-year GH Archive backfill (2021&#8211;2026) &#8594; 26 evidence-grounded playbook candidates, every stage traced back to real PR text</text>
