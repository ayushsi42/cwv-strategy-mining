<text x="18" y="72" font-size="11.3" fill="#64748b">HDBSCAN groups the novel pool,</text>
<text x="18" y="87.5" font-size="11.3" fill="#64748b">then a dedicated pass verifies each</text>
<text x="18" y="103.0" font-size="11.3" fill="#64748b">cluster is genuinely one technique</text>
<line x1="18" y1="128" x2="226" y2="128" stroke="#eef1f5" stroke-width="1.5"/>
<text x="18" y="157" font-size="18" font-weight="800" fill="#e11d48">75 → 20</text>
<text x="18" y="174" font-size="10.5" fill="#94a3b8">raw → coherent clusters</text>
</g>
