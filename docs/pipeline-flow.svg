<text x="18" y="87.5" font-size="11.3" fill="#64748b">extract technique, mechanism</text>
<text x="18" y="103.0" font-size="11.3" fill="#64748b">&#38; affected resource — real facts</text>
<line x1="18" y1="128" x2="226" y2="128" stroke="#eef1f5" stroke-width="1.5"/>
